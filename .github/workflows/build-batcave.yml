name: Build BatCave Collections

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/en/batcavecollections/**'
      - '.github/workflows/build-batcave.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build BatCave Collections
        run: ./gradlew :src:en:batcavecollections:build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: batcave-collections
          path: src/en/batcavecollections/build/outputs/apk/*
